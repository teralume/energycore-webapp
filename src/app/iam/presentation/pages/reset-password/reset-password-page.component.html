<section class="auth-page">
  <article class="auth-card">
    <app-auth-visual-panel [compact]="true" />

    <div class="auth-card__content">
      <p class="eyebrow">
        <span aria-hidden="true"></span>
        {{ 'auth.resetPasswordEyebrow' | translate }}
      </p>

      <h1>{{ 'auth.resetPasswordTitle' | translate }}</h1>

      <p class="subtitle">
        {{ 'auth.resetPasswordSubtitle' | translate }}
      </p>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <label>
          <span class="field-label">
            <svg lucideLockKeyhole aria-hidden="true"></svg>
            {{ 'auth.newPassword' | translate }}
          </span>
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </label>

        <label>
          <span class="field-label">
            <svg lucideLockKeyhole aria-hidden="true"></svg>
            {{ 'auth.confirmPassword' | translate }}
          </span>
          <input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </label>

        <app-button
          type="submit"
          variant="create"
          [disabled]="iamFacade.loading() || !token"
          [block]="true"
        >
          @if (iamFacade.loading()) {
            {{ 'common.loading' | translate }}
          } @else {
            <svg lucideKeyRound aria-hidden="true"></svg>
            {{ 'auth.resetPasswordAction' | translate }}
          }
        </app-button>
      </form>

      <div class="links">
        <a routerLink="/iam/login">
          {{ 'auth.backToLogin' | translate }}
        </a>
      </div>
    </div>
  </article>
</section>
